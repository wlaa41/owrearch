<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#e0f7fa"/>

  <!-- Electrical Symbol Pattern -->
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#b2ebf2" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#4dd0e1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- OW Electrician Logo -->
  <circle cx="40" cy="40" r="30" stroke="black" stroke-width="2" fill="#ff5722" />
  <text x="40" y="45" font-family="Verdana, sans-serif" font-size="20" fill="white" text-anchor="middle" alignment-baseline="middle">
    OW
  </text>

  <!-- Regulation Number -->
  <text x="50%" y="50%" font-family="Verdana, sans-serif" font-size="24" fill="black" text-anchor="middle" alignment-baseline="middle">
    Regulation 531.3.5.2, P158
  </text>

  <!-- Electric Bolt Icon -->
  <polygon points="250,75 225,125 250,115 225,175 250,125 275,75 250,85" fill="#ffeb3b" stroke="black" stroke-width="2"/>

  <!-- Bottom Bar with Electrician Theme -->
  <rect x="0" y="180" width="400" height="20" fill="#ff5722"/>
  <text x="200" y="195" font-family="Verdana, sans-serif" font-size="12" fill="white" text-anchor="middle" alignment-baseline="middle">
    OW Electrician & Home Automation Engineers
  </text>
</svg>
